<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominó Clube</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b20;color:#f5f3e9;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#17282e;border-bottom:1px solid #35484a}h1{font-size:24px;margin:0;color:#f4d38a}h2{margin:0 0 14px}button,input,select{font:inherit;border-radius:8px;padding:11px;border:1px solid #506367}button{background:#e5bd70;color:#192323;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:default}input,select{background:#102128;color:white;min-width:0}label{display:grid;gap:5px;color:#c6d5d2}.panel{background:#1d3037;border:1px solid #405358;padding:24px;border-radius:16px}.lobby{max-width:920px;margin:50px auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:15px}.fields{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.game{padding:12px;max-width:1800px;margin:auto}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.table{min-height:58vh;border:9px solid #795438;border-radius:24px;background:radial-gradient(ellipse,#237354,#124b37);box-shadow:inset 0 0 35px #082d23;position:relative;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.players{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.player{background:#103d30;padding:9px 14px;border-radius:10px;border:2px solid transparent;min-width:115px;text-align:center}.player.active{border-color:#f5d07d}.muted{color:#a9c5be;font-size:13px}.chain{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;flex:1;min-height:130px}.tile{display:inline-flex;flex-direction:column;width:46px;height:90px;border:1px solid #c5bda8;border-radius:6px;background:#fff7e5;box-shadow:0 3px 0 #b6ad99;padding:0;overflow:hidden;flex-shrink:0}.tile.horizontal{flex-direction:row;width:78px;height:39px}.half{position:relative;flex:1;min-width:0;min-height:0}.half+.half{border-top:1px solid #aaa18e}.horizontal .half+.half{border-top:0;border-left:1px solid #aaa18e}.pip{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--pip)}.hand{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px}.tile.pick{outline:3px solid #ffd36f;transform:translateY(-5px)}.tile.legal{cursor:pointer}.tile.no{opacity:.55}.status{text-align:center;font-weight:bold;color:#ffe0a0}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.result{text-align:center;background:#17282e;border:2px solid #e5bd70;border-radius:12px;padding:20px;margin:10px 0;font-size:23px}.chat{display:flex;gap:10px;align-items:center;margin-top:10px}.chatlog{max-height:100px;overflow:auto;flex:1;font-size:13px}.hidden{display:none!important}.dark .tile{background:#232b34;border-color:#87909c;box-shadow:0 3px 0 #080e13}.classic .pip{background:#242424}.blue.table{background:radial-gradient(ellipse,#275a82,#102b4b)}.red.table{background:radial-gradient(ellipse,#8c4147,#4b1724)}@media(max-width:650px){.lobby{grid-template-columns:1fr;margin:10px auto}.table{min-height:49vh;border-width:5px}.tile{width:36px;height:70px}.tile.horizontal{width:54px;height:27px}.hand{gap:5px}.player{min-width:70px;padding:6px;font-size:12px}header{padding:10px}.chat{flex-wrap:wrap}}
</style><header><h1>◈ DOMINÓ CLUBE</h1><div class="row"><span id="conn" class="muted">Conectando…</span><button id="full">Tela cheia</button></div></header><main id="home" class="lobby"><section class="panel fields"><h2>Criar uma mesa</h2><label>Seu nome<input id="name" maxlength="24" placeholder="Seu nome"></label><label>Jogadores<select id="max"><option>4</option><option>3</option><option>2</option></select></label><label>Modalidade<select id="teams"><option value="1">Duplas (4 jogadores)</option><option value="0">Individual</option></select></label><label>Meta de pontos<select id="target"><option>100</option><option>50</option><option>200</option></select></label><label>Regra de compra<select id="rule"><option value="pass">Sem compra — passa a vez</option><option value="buy">Comprar se não puder jogar</option></select></label><label>Senha opcional<input id="password" type="password"></label><button id="create">Criar sala</button></section><section class="panel fields"><h2>Entrar com amigos</h2><label>Seu nome<input id="joinname" maxlength="24"></label><label>Código da sala<input id="code" maxlength="6"></label><label>Senha (se houver)<input id="joinpass" type="password"></label><button id="join">Entrar para jogar</button><button id="watch">Assistir partida</button><p class="muted">Para jogar sozinho, crie uma sala e inicie com robôs. Compartilhe o código para convidar amigos.</p></section></main><main id="game" class="game hidden"><div class="bar"><div class="row"><strong id="room"></strong><button id="share">Copiar convite</button><span id="spect" class="muted"></span></div><div class="row"><select id="style"><option value="color">Pedras coloridas</option><option value="classic">Tradicionais</option><option value="dark">Escuras coloridas</option></select><select id="felt"><option value="">Mesa verde</option><option value="blue">Mesa azul</option><option value="red">Mesa vinho</option></select><label><span><input type="checkbox" id="sound" checked> Som</span></label><button id="leave">Sair</button></div></div><div id="scores" class="row"></div><div id="result" class="result hidden"></div><section id="table" class="table"><div id="players" class="players"></div><div id="chain" class="chain"></div><div id="status" class="status"></div></section><div id="hand" class="hand"></div><div class="controls"><button id="start">Iniciar (completar com robôs)</button><button id="left">Jogar na esquerda</button><button id="right">Jogar na direita</button><button id="draw">Comprar</button><button id="pass">Passar vez</button><button id="next">Próxima rodada / revanche</button></div><div class="chat"><div id="chatlog" class="chatlog"></div><input id="msg" placeholder="Mensagem" maxlength="200"><button id="send">Enviar</button></div></main><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io(),emit=(e,d)=>socket.emit(e,d),colors=['#333','#2674df','#df3434','#15934c','#9333bd','#e67b12','#0099a6'],dots=[[],[[50,50]],[[25,25],[75,75]],[[25,25],[50,50],[75,75]],[[25,25],[75,25],[25,75],[75,75]],[[25,25],[75,25],[50,50],[25,75],[75,75]],[[25,23],[75,23],[25,50],[75,50],[25,77],[75,77]]];let state,selected=-1,session;try{session=JSON.parse(sessionStorage.getItem('dominoSession'))}catch{}let query=new URLSearchParams(location.search);$('code').value=query.get('sala')||'';const val=x=>$(x).value;const show=(x,b)=>$(x).classList.toggle('hidden',!b);const txt=(x,t)=>$(x).textContent=t;function node(tag,cls,text){let e=document.createElement(tag);e.className=cls||'';if(text!==undefined)e.textContent=text;return e}function tile(t,h=false){let e=node('div','tile'+(h?' horizontal':''));e.setAttribute('aria-label',t.join(' e '));for(let v of t){let half=node('div','half');for(let [x,y] of dots[v]){let p=node('i','pip');p.style.cssText=`left:${x}%;top:${y}%;--pip:${colors[v]}`;half.append(p)}e.append(half)}return e}function matches(t,side){return !state.chain.length||t.includes(side==='L'?state.chain[0][0]:state.chain.at(-1)[1])}function legal(t){if(!state.chain.length){let best=Math.max(...state.hand.map(a=>a[0]===a[1]?100+a[0]:a[0]+a[1]));return (t[0]===t[1]?100+t[0]:t[0]+t[1])===best}return matches(t,'L')||matches(t,'R')}function controls(){let s=state,turn=s.phase==='play'&&s.seat===s.turn,t=s.hand[selected],can=s.hand.some(legal);for(let i of ['left','right','draw','pass'])show(i,turn);$('left').disabled=!t||!matches(t,'L')||!legal(t);$('right').disabled=!t||!matches(t,'R')||!legal(t);$('draw').disabled=can||!s.stock||s.rule!=='buy';$('pass').disabled=can||(s.stock>0&&s.rule==='buy');show('start',s.host&&s.phase==='lobby');show('next',s.host&&s.phase==='end');}
function update(s){let prev=state;state=s;show('home',false);show('game',true);txt('room','Sala '+s.code);txt('spect',s.watch+' espectador(es)');$('scores').replaceChildren(...s.score.map((v,i)=>node('span','player',(s.teams?'Dupla '+(i+1):s.players[i]?.name||'Vaga '+(i+1))+': '+v+' / '+s.target)));$('players').replaceChildren(...s.players.map((p,i)=>{let e=node('div','player'+(s.phase==='play'&&i===s.turn?' active':''));e.append(node('strong','',p.name+(i===s.seat?' (você)':'')),node('div','muted',p.count+' pedras'+(s.teams?' · Dupla '+(i%2+1):'')+(p.online?'':' · offline')));return e}));if(!prev||JSON.stringify(prev.chain)!==JSON.stringify(s.chain)){ $('chain').replaceChildren(...s.chain.map(t=>tile(t,true)));if(prev&&s.chain.length>prev.chain.length&&$('sound').checked)beep();}if(!prev||JSON.stringify(prev.hand)!==JSON.stringify(s.hand)||prev.turn!==s.turn||prev.phase!==s.phase){selected=-1;$('hand').replaceChildren(...s.hand.map((t,i)=>{let e=tile(t);let ok=s.phase==='play'&&s.seat===s.turn&&legal(t);e.classList.add(ok?'legal':'no');e.onclick=()=>{if(!ok)return;selected=i;[...$('hand').children].forEach((x,j)=>x.classList.toggle('pick',j===i));if(!s.chain.length||matches(t,'L')!==matches(t,'R'))emit('play',{k:i,side:matches(t,'L')?'L':'R'});else controls()};return e}));}txt('status',s.phase==='lobby'?'Aguardando jogadores · '+s.players.length+'/'+s.max:s.phase==='end'?'Rodada encerrada':(s.seat===s.turn?'É SUA VEZ!': 'Vez de '+s.players[s.turn]?.name)+' · Monte: '+s.stock);show('result',s.phase==='end');txt('result',s.result||'');if(!prev||JSON.stringify(prev.chat)!==JSON.stringify(s.chat)){$('chatlog').replaceChildren(...s.chat.map(m=>node('div','',m.name+': '+m.msg)));$('chatlog').scrollTop=$('chatlog').scrollHeight}controls()}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=420;g.gain.value=.045;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1);o.onended=()=>a.close()}catch{}}
socket.on('connect',()=>{txt('conn','● Online');if(session)emit('join',session)});socket.on('disconnect',()=>txt('conn','Reconectando…'));socket.on('session',s=>{session=s;sessionStorage.setItem('dominoSession',JSON.stringify(s))});socket.on('state',update);socket.on('notice',m=>{alert(m);if(!state){session=null;sessionStorage.removeItem('dominoSession')}});$('create').onclick=()=>emit('create',{name:val('name'),max:val('max'),teams:val('teams')==='1',target:val('target'),rule:val('rule'),password:val('password')});for(let w of ['join','watch'])$(w).onclick=()=>emit('join',{code:val('code'),name:val('joinname'),password:val('joinpass'),watch:w==='watch'});for(let e of ['start','next','pass','draw'])$(e).onclick=()=>emit(e);for(let [e,side] of [['left','L'],['right','R']])$(e).onclick=()=>emit('play',{k:selected,side});$('share').onclick=async()=>{let link=location.origin+'/?sala='+state.code;try{await navigator.clipboard.writeText(link);txt('share','Copiado!');setTimeout(()=>txt('share','Copiar convite'),1500)}catch{prompt('Copie o convite',link)}};$('leave').onclick=()=>{sessionStorage.removeItem('dominoSession');location.href=location.pathname};$('style').onchange=()=>document.body.className=val('style');$('felt').onchange=()=>$('table').className='table '+val('felt');$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};$('send').onclick=()=>{emit('chat',val('msg'));$('msg').value=''};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('max').onchange=()=>{$('teams').disabled=val('max')!=='4';if($('teams').disabled)$('teams').value='0'};
</script></html>
