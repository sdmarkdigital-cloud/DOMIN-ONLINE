*{box-sizing:border-box}body{margin:0;background:#101b20;color:#f5f3e9;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#17282e;border-bottom:1px solid #35484a}h1{font-size:24px;margin:0;color:#f4d38a}h2{margin:0 0 14px}button,input,select{font:inherit;border-radius:8px;padding:11px;border:1px solid #506367}button{background:#e5bd70;color:#192323;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:default}input,select{background:#102128;color:white;min-width:0}label{display:grid;gap:5px;color:#c6d5d2}.panel{background:#1d3037;border:1px solid #405358;padding:24px;border-radius:16px}.lobby{max-width:920px;margin:50px auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:15px}.fields{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.game{padding:12px;max-width:1800px;margin:auto}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.table{min-height:58vh;border:9px solid #795438;border-radius:24px;background:radial-gradient(ellipse,#237354,#124b37);box-shadow:inset 0 0 35px #082d23;position:relative;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.players{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.player{background:#103d30;padding:9px 14px;border-radius:10px;border:2px solid transparent;min-width:115px;text-align:center}.player.active{border-color:#f5d07d}.muted{color:#a9c5be;font-size:13px}.chain{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;flex:1;min-height:130px}.tile{display:inline-flex;flex-direction:column;width:46px;height:90px;border:1px solid #c5bda8;border-radius:6px;background:#fff7e5;box-shadow:0 3px 0 #b6ad99;padding:0;overflow:hidden;flex-shrink:0}.tile.horizontal{flex-direction:row;width:78px;height:39px}.half{position:relative;flex:1;min-width:0;min-height:0}.half+.half{border-top:1 /* Expanded play area and connected domino track */
.game{max-width:none;width:100%;padding:6px 10px}.bar{margin-bottom:4px}.bar button,.bar select{padding:6px 9px}header{padding:7px 12px}header button{padding:6px 10px}.table{height: max(64vh, calc(100dvh - 245px));min-height:360px;border-width:7px;padding:8px;gap:5px}.players{gap:6px}.player{padding:5px 10px}.chain{position:relative;display:block;flex:1;min-height:0;overflow:hidden}.track{position:absolute;left:50%;top:50%;transform-origin:center;pointer-events:none}.track .tile{position:absolute;margin:0;box-shadow:0 2px 0 #b6ad99;border-radius:4px}.track .tile.endpoint{outline:2px solid #f5d07d;outline-offset:1px}.hand{padding:7px;gap:7px}.hand .tile{width:40px;height:80px}.controls button{padding:7px 12px}.chat{margin-top:5px}.chat input,.chat button{padding:6px 10px}.chatlog{max-height:45px}.result{padding:6px;margin:4px 0;font-size:17px}.status{font-size:14px}.dark .track .tile{box-shadow:0 2px 0 #080e13}@media(max-width:650px){.game{padding:4px}.table{height: max(60vh, calc(100dvh - 245px));min-height:310px;border-width:5px;padding:5px}.hand .tile{width:32px;height:64px}.bar{gap:4px}.bar button,.bar select{font-size:12px;padding:4px}.players{gap:3px}.player{min-width:65px;padding:3px 5px}.controls button{font-size:12px;padding:6px}.chatlog{max-height:35px}}

body:has(#game:not(.hidden)){height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;min-height:36px;padding:4px 10px}header h1{font-size:20px}header .version{font-size:11px;color:#b7d7c9;margin-left:10px;font-weight:normal}

</style><header><h1>◈ DOMINÓ CLUBE <span class="version">v1.5</span></h1><div class="row"><span id="conn" class="muted">Conectando…</span><button id="full">Tela cheia</button></div></header><main id="home" class="lobby"><section class="panel fields"><h2>Criar uma mesa</h2><label>Seu nome<input id="name" maxlength="24" placeholder="Seu nome"></label><label>Jogadores<select id="max"><option>4</option><option>3</option><option>2</option></select></label><label>Modalidade<select id="teams"><option value="1">Duplas (4 jogadores)</option><option value="0">Individual</option></select></label><p class="muted">Cada rodada vale 1 ponto. Primeiro a 4 vence. 4 × 0 = GATO!</p><label>Regra de compra<select id="rule"><option value="pass">Sem compra — passa a vez</option><option value="buy">Comprar se não puder jogar</option></select></label><label>Senha opcional<input id="password" type="password"></label><button id="create">Criar sala</button></section><section class="panel fields"><h2>Entrar com amigos</h2><label>Seu nome<input id="joinname" maxlength="24"></label><label>Código da sala<input id="code" maxlength="6"></label><label>Senha (se houver)<input id="joinpass" type="password"></label><button id="join">Entrar para jogar</button><button id="watch">Assistir partida</button><p class="muted">Para jogar sozinho, crie uma sala e inicie com robôs. Compartilhe o código para convidar amigos.</p></section></main><main id="game" class="game hidden"><div class="bar"><div class="row"><strong id="room"></strong><button id="share">Copiar convite</button><span id="spect" class="muted"></span></div><div class="row"><select id="style"><option value="color">Pedras coloridas</option><option value="classic">Tradicionais</option><option value="dark">Escuras coloridas</option></select><select id="felt"><option value="">Mesa verde</option><option value="blue">Mesa azul</option><option value="red">Mesa vinho</option></select><label><span><input type="checkbox" id="sound" checked> Som</span></label><button id="leave">Sair</button></div></div><div id="scores" class="row"></div><div id="result" class="result hidden"></div><section id="table" class="table"><div id="players" class="players"></div><div id="chain" class="chain"></div><div id="status" class="status"></div></section><div id="hand" class="hand"></div><div class="controls"><button id="start">Iniciar (completar com robôs)</button><button id="left">Jogar na esquerda</button><button id="right">Jogar na direita</button><button id="draw">Comprar</button><button id="pass">Passar vez</button><button id="next">Próxima rodada / revanche</button></div><div class="chat"><div id="chatlog" class="chatlog"></div><input id="msg" placeholder="Mensagem" maxlength="200"><button id="send">Enviar</button></div></main><script src="/socket.io/socket.io.js"></script><script>
const $=x=>document.getElementById(x),socket=io(),emit=(e,d)=>socket.emit(e,d),colors=['#333','#2674df','#df3434','#15934c','#9333bd','#e67b12','#0099a6'],dots=[[],[[50,50]],[[25,25],[75,75]],[[25,25],[50,50],[75,75]],[[25,25],[75,25],[25,75],[75,75]],[[25,25],[75,25],[50,50],[25,75],[75,75]],[[25,23],[75,23],[25,50],[75,50],[25,77],[75,77]]];let state,selected=-1,session;try{session=JSON.parse(sessionStorage.getItem('dominoSession'))}catch{}let query=new URLSearchParams(location.search);$('code').value=query.get('sala')||'';const val=x=>$(x).value;const show=(x,b)=>$(x).classList.toggle('hidden',!b);const txt=(x,t)=>$(x).textContent=t;function node(tag,cls,text){let e=document.createElement(tag);e.className=cls||'';if(text!==undefined)e.textContent=text;return e}function tile(t,h=false){let e=node('div','tile'+(h?' horizontal':''));e.setAttribute('aria-label',t.join(' e '));for(let v of t){let half=node('div','half');for(let [x,y] of dots[v]){if(h)[x,y]=[100-y,x];let p=node('i','pip');p.style.cssText=`left:${x}%;top:${y}%;--pip:${colors[v]}`;half.append(p)}e.append(half)}return e}function matches(t,side){return !state.chain.length||t.includes(side==='L'?state.chain[0][0]:state.chain.at(-1)[1])}function legal(t){if(!state.chain.length){let best=Math.max(...state.hand.map(a=>a[0]===a[1]?100+a[0]:a[0]+a[1]));return (t[0]===t[1]?100+t[0]:t[0]+t[1])===best}return matches(t,'L')||matches(t,'R')}function controls(){let s=state,turn=s.phase==='play'&&s.seat===s.turn,t=s.hand[selected],can=s.hand.some(legal);for(let i of ['left','right','draw','pass'])show(i,turn);$('left').disabled=!t||!matches(t,'L')||!legal(t);$('right').disabled=!t||!matches(t,'R')||!legal(t);$('draw').disabled=can||!s.stock||s.rule!=='buy';$('pass').disabled=can||(s.stock>0&&s.rule==='buy');show('start',s.host&&s.phase==='lobby');show('next',s.host&&s.phase==='end');txt('next',s.match?'Revanche':'Próxima rodada');}
function update(s){let prev=state;state=s;show('home',false);show('game',true);txt('room','Sala '+s.code);txt('spect',s.watch+' espectador(es)');$('scores').replaceChildren(...s.score.map((v,i)=>node('span','player',(s.teams?'Dupla '+(i+1):s.players[i]?.name||'Vaga '+(i+1))+': '+v+' / '+s.target)));$('players').replaceChildren(...s.players.map((p,i)=>{let e=node('div','player'+(s.phase==='play'&&i===s.turn?' active':''));e.append(node('strong','',p.name+(i===s.seat?' (você)':'')),node('div','muted',p.count+' pedras'+(s.teams?' · Dupla '+(i%2+1):'')+(p.online?'':' · offline')));return e}));if(!prev||prev.phase!==s.phase||JSON.stringify(prev.chain)!==JSON.stringify(s.chain)){ try{renderTrack()}catch(e){console.error("Falha ao desenhar mesa",e);$('chain').replaceChildren(...s.chain.map(t=>tile(t,t[0]!==t[1])))}if(prev&&s.chain.length>prev.chain.length&&$('sound').checked)beep();}if(!prev||JSON.stringify(prev.hand)!==JSON.stringify(s.hand)||prev.turn!==s.turn||prev.phase!==s.phase){selected=-1;$('hand').replaceChildren(...s.hand.map((t,i)=>{let e=tile(t);let ok=s.phase==='play'&&s.seat===s.turn&&legal(t);e.classList.add(ok?'legal':'no');e.onclick=()=>{if(state.phase!=='play'||state.seat!==state.turn||!legal(state.hand[i]))return;const t=state.hand[i];selected=i;[...$('hand').children].forEach((x,j)=>x.classList.toggle('pick',j===i));if(!state.chain.length||matches(t,'L')!==matches(t,'R'))emit('play',{k:i,side:matches(t,'L')?'L':'R'});else controls()};return e}));}txt('status',s.phase==='lobby'?'Aguardando jogadores · '+s.players.length+'/'+s.max:s.phase==='end'?(s.match?'Partida encerrada':'Rodada encerrada'):(s.seat===s.turn?'É SUA VEZ!': 'Vez de '+s.players[s.turn]?.name)+' · Monte: '+s.stock);show('result',s.phase==='end');txt('result',s.result||'');if(!prev||JSON.stringify(prev.chat)!==JSON.stringify(s.chat)){$('chatlog').replaceChildren(...s.chat.map(m=>node('div','',m.name+': '+m.msg)));$('chatlog').scrollTop=$('chatlog').scrollHeight}controls()}

// Build a continuous serpentine path. Two upright connecting tiles make each U-turn.
function trackLayout(chain,limit){
 const out=[];let i=0,dir=1,x=0,y=0;
 const dbl=t=>t[0]===t[1];
 function place(t,cx,cy,h,reverse=false){out.push({t:reverse?[t[1],t[0]]:t,x:cx,y:cy,h});}
 while(i<chain.length){
  let remaining=chain.length-i,n=remaining;
  if(remaining>limit){let choices=[];for(let k=1;k<=Math.min(limit+3,remaining-4);k++)if(!dbl(chain[i+k-1])&&!dbl(chain[i+k])&&!dbl(chain[i+k+1])&&!dbl(chain[i+k+2]))choices.push(k);if(choices.length)n=choices.sort((a,b)=>Math.abs(a-limit)-Math.abs(b-limit))[0];}
  for(let j=0;j<n;j++){let t=chain[i++],d=dbl(t),w=d?1:2;place(t,x+dir*w/2,y,!d,dir<0&&!d);x+=dir*w;}
  if(i<chain.length){let cx=x+dir*.5;place(chain[i++],cx,y+.5,false);place(chain[i++],cx,y+2.5,false);y+=3;dir=-dir;}
 }
 return out;
}
function renderTrack(){
 if(!state)return;const host=$('chain'),w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;const c=state.chain;if(!c.length){host.replaceChildren();return;}
 let best=null;for(let limit=3;limit<=Math.max(3,Math.min(28,c.length+1));limit++){
  const items=trackLayout(c,limit),minX=Math.min(...items.map(p=>p.x-(p.h?1:.5))),maxX=Math.max(...items.map(p=>p.x+(p.h?1:.5))),minY=Math.min(...items.map(p=>p.y-(p.h?.5:1))),maxY=Math.max(...items.map(p=>p.y+(p.h?.5:1)));const bw=maxX-minX,bh=maxY-minY,unit=Math.min(62,(w-18)/bw,(h-18)/bh);const score=unit-Math.abs(limit-(w>800?10:5))*.15;if(!best||score>best.score)best={items,minX,minY,bw,bh,unit,score};
 }
 const {items,minX,minY,bw,bh,unit:u}=best;const track=node('div','track');track.style.cssText=`width:${bw*u}px;height:${bh*u}px;transform:translate(-50%,-50%)`;
 items.forEach((p,i)=>{const e=tile(p.t,p.h);const tw=(p.h?2:1)*u,th=(p.h?1:2)*u;e.style.cssText=`width:${tw-2}px;height:${th-2}px;left:${(p.x-minX)*u-tw/2+1}px;top:${(p.y-minY)*u-th/2+1}px`;if(state.phase==='play'&&(i===0||i===items.length-1))e.classList.add('endpoint');track.append(e);});host.replaceChildren(track);
}
new ResizeObserver(()=>{try{renderTrack()}catch(e){console.error(e)}}).observe($('chain'));

function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=420;g.gain.value=.045;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.stop(a.currentTime+.1);o.onended=()=>a.close()}catch{}}
socket.on('connect',()=>{txt('conn','● Online');if(session)emit('join',session)});socket.on('disconnect',()=>txt('conn','Reconectando…'));socket.on('session',s=>{session=s;sessionStorage.setItem('dominoSession',JSON.stringify(s))});socket.on('state',update);socket.on('notice',m=>{alert(m);if(!state){session=null;sessionStorage.removeItem('dominoSession')}});$('create').onclick=()=>emit('create',{name:val('name'),max:val('max'),teams:val('teams')==='1',rule:val('rule'),password:val('password')});for(let w of ['join','watch'])$(w).onclick=()=>emit('join',{code:val('code'),name:val('joinname'),password:val('joinpass'),watch:w==='watch'});for(let e of ['start','next','pass','draw'])$(e).onclick=()=>emit(e);for(let [e,side] of [['left','L'],['right','R']])$(e).onclick=()=>emit('play',{k:selected,side});$('share').onclick=async()=>{let link=location.origin+'/?sala='+state.code;try{await navigator.clipboard.writeText(link);txt('share','Copiado!');setTimeout(()=>txt('share','Copiar convite'),1500)}catch{prompt('Copie o convite',link)}};$('leave').onclick=()=>{sessionStorage.removeItem('dominoSession');location.href=location.pathname};$('style').onchange=()=>document.body.className=val('style');$('felt').onchange=()=>$('table').className='table '+val('felt');$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};$('send').onclick=()=>{emit('chat',val('msg'));$('msg').value=''};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('max').onchange=()=>{$('teams').disabled=val('max')!=='4';if($('teams').disabled)$('teams').value='0'};
